services:
  postgres:
    image: postgres:15-alpine
    container_name: repox-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-repo_architect}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-repo_architect}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    container_name: repox-backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-repo_architect}
      WORK_DIR: /tmp/repo-architect
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - repo_temp:/tmp/repo-architect
      - ./backend:/app/backend
    restart: unless-stopped

volumes:
  postgres_data:
    name: code-architecture-mapper-main_postgres_data
  repo_temp:
    name: code-architecture-mapper-main_repo_temp

